name: release-exe

# 打包 Windows 单目录发行包（PyInstaller）并冒烟，然后挂到同一个 GitHub Release 上。
# 为什么在 runner 上构建而不是本机：PyInstaller 不从索引装的话没法用，而本仓库
# 的离线纪律（vendor/*.whl）只覆盖界面依赖，没有 PyInstaller 的 wheel。
#
# 与 release-executor 的关系：两者**共用同一个 tag `v{version}`**。
# 推荐顺序：先手动跑 release-executor（它会创建 Release 并把 5 平台执行器挂上去），
# 它打的 tag 会**自动触发本工作流**（见下面的 push.tags），于是同一个 Release 上
# 又多出一个 exe 附件——一次发布，两样产物都齐。
# 也可以单独手动跑本工作流（Release 不存在就自己建）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本(如 3.41.0;留空自动读 core/version.py)"
        required: false
        type: string
  push:
    tags:
      - "v*"      # release-executor 打完 tag 后自动接手，避免"忘了跑第二个"

permissions:
  contents: write   # gh release create / upload 需要

concurrency:
  group: release-exe
  cancel-in-progress: false   # 并发的第二次等第一次跑完，避免半成品 Release

jobs:
  windows-exe:
    name: Build + smoke (windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 界面依赖进包才需要装；核心是零依赖的，但 --preview/首屏要 prompt_toolkit。
      # **requests 必须有**：源码态下它是懒导入且有降级，但冻结是构建期决定捆哪些模块，
      # 冻结后 ace_net 会直接 require 它（供应商那一层没有降级可走）。
      # 官方源优先、镜像兜底 —— 与 setup_env.py 的立场一致。
      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests prompt_toolkit rich textual

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) {
            $v = (Select-String -Path core/version.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          }
          Write-Host "version=$v"
          "version=$v" >> $env:GITHUB_OUTPUT

      # 先用源码跑一遍全量：打包不该掩盖一个本来就红的仓库。
      - name: Full test suite (source)
        shell: pwsh
        run: python test_all.py

      # 打包脚本自身的约束（纯 ASCII / 能被 PS 5.1 解析 / 不撞自动变量 /
      # 冒烟 mark 真的会出现）。这一步在 runner 上才有意义：本机是 pwsh 7，
      # 看不出"无 BOM 的 UTF-8 被 5.1 按 ANSI 读"那类问题——它已经弄红过 CI 三次。
      # 不加 if: always()：全量测试红了就该停在那里，而不是再叠一层误导性的报错。
      - name: Packaging self-check (ASCII purity and smoke marks)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/check_packaging.ps1

      # 构建 + 冒烟都在脚本里；冒烟不过脚本就非零退出，这一步红，就不会发布。
      - name: Build exe and run smoke gate
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build_exe.ps1 -Python python

      - name: Zip the folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path dist/ace/* -DestinationPath "release-assets/ace-${{ steps.v.outputs.version }}-windows-amd64.zip" -Force
          Get-ChildItem release-assets | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ace-exe-windows-amd64
          path: release-assets/ace-*-windows-amd64.zip
          if-no-files-found: error

      - name: Attach to release
        # 由 tag 触发时不碰 Release：那是 release-executor 的职责（它创建 tag 与 Release），
        # 两个工作流同时去 create 会互相打架（一个成功、另一个 422 红掉整条流水线）。
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.v.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "见 CHANGELOG.md 的 $tag 条目。"
          }
          gh release upload $tag "release-assets/ace-${{ steps.v.outputs.version }}-windows-amd64.zip" --clobber

  # tag 推送触发时，Release 由 release-executor 建、exe 附件由上面的 job 负责。
  # 这个 job 只做一件轻量的事：确认"版本单源 / CHANGELOG 条目 / tag"三者对得上。
  # 为什么值得单列：发布事故里最常见的一类就是三者不一致——tag 打了 v3.41.0，
  # CHANGELOG 里却没有这一条，于是用户点进 Release 看不到任何变更说明。
  verify-release-tuple:
    name: version == CHANGELOG == tag
    runs-on: ubuntu-latest
    needs: [windows-exe]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check the three agree
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('core/version.py',encoding='utf-8').read()).group(1))")
          # core/version.py holds a BARE version ("3.41.0"); CHANGELOG headings and
          # git tags carry the "v" prefix ("## [v3.41.0]", tag v3.41.0). Define the
          # prefixed form ONCE and use it everywhere -- the first version of this
          # check grepped for "## [3.41.0]" (no v) and so failed on a release whose
          # changelog entry was perfectly fine. Getting this wrong is exactly the
          # class of inconsistency this step exists to catch.
          TAG="v$V"
          echo "core/version.py = $V   ->   tag = $TAG"
          if ! grep -qF "## [$TAG]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 ## [$TAG] 条目 —— 版本单源与变更记录对不上，先补条目再发布"
            exit 1
          fi
          echo "CHANGELOG.md 有 $TAG 条目"
          if git tag -l "$TAG" | grep -q .; then
            echo "tag $TAG 已存在:"
            git tag -l "$TAG" | sed 's/^/  /'
          else
            echo "  （$TAG 还没有 tag —— release-executor 会创建它）"
          fi

name: release-images

# 构建并发布预编译容器镜像到 GHCR —— 让 Linux / macOS 用户不必自己 build。
#
# 只发布两个（都是小体积、且是"用户真的需要预编译"的那两个）：
#   ace-sandbox  —— --sandbox docker 的一次性执行容器，多架构（amd64 + arm64）
#   ace-agent    —— 整体镜像的 lite 档（~180MB），多架构
# standard / full 不在这里发：带内置 VLM，产物 2~3GB，发布成本远大于收益，按需本地构建。
#
# 触发：workflow_dispatch（发布是显式人工动作，与本仓 release-executor 一致；
# 想让它跟着 Release 自动跑，就在 on: 下加一行 `release: {types: [published]}`）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本标签(如 3.10.1;留空自动读 core/version.py)"
        required: false
        type: string

permissions:
  contents: read
  packages: write      # 推 GHCR 必需

concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.resolved }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and namespace
        id: v
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            # 注意 core. 前缀不可省：R-07 之后版本模块在 core/version.py，
            # 裸 `import version` 会 ModuleNotFoundError（[38] 的 R7 守卫盯着这条）
            VERSION="$(python3 -c 'from core import version; print(version.__version__)')"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"
          # 组织名下镜像必须落在 owner 命名空间：ghcr.io/<owner>/<name>
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "will publish version ${VERSION} under ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

  sandbox:
    name: Sandbox image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    needs: [resolve]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 交叉构建（macOS Apple Silicon 要用）
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true          # 构建来源证明
          sbom: true                # 附带 SBOM
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-sandbox:${{ needs.resolve.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-sandbox:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.title=ace-sandbox
            org.opencontainers.image.description=ACE 一次性执行容器（--sandbox docker）
      - name: Record digest
        run: |
          echo "### ace-sandbox" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 固定供应链：\`--sandbox-image ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-sandbox@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # 光推上去不算数：这里用**客户端自己的参数构造**真跑一遍，验证
  #   (1) 镜像可用、(2) 那套加固参数（--init/--ulimit/--read-only/--cap-drop …）
  #       在真实 daemon 上被接受、且不把正常命令弄坏。
  # 本机没有 docker daemon 时这一步跑不了，所以它必须待在 CI 里。
  smoke:
    name: Sandbox smoke (real docker run)
    runs-on: ubuntu-latest
    needs: [resolve]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published image and run through DockerSandbox
        env:
          IMG: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-sandbox:${{ needs.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tools.docker_sandbox import DockerSandbox

          img = os.environ["IMG"]
          sb = DockerSandbox(os.getcwd(), image=img, auto_pull=True)
          assert sb.probe(), f"docker daemon 不可达: {sb.detail}"
          out = sb.run_shell("python -c \"print('sandbox-ok')\" && echo wrote > /work/smoke.txt")
          print("stdout:", out["stdout"])
          print("stderr:", out["stderr"])
          print("rc:", out["returncode"], "denied:", out["sandbox_denied"])
          assert out["returncode"] == 0, out
          assert "sandbox-ok" in out["stdout"], out
          assert os.path.exists("smoke.txt"), "工作目录挂载没生效"

          # 边界断言：没有网络、根文件系统只读
          net = sb.run_shell("python -c \"import socket;socket.create_connection(('1.1.1.1',53),2)\"")
          assert net["returncode"] != 0, f"网络居然通: {net}"
          ro = sb.run_shell("touch /etc/should-fail")
          assert ro["returncode"] != 0, f"根文件系统可写: {ro}"
          print("digest:", sb.image_digest or "(未取到)")
          print("OK: 镜像可用，加固参数被接受，网络与根文件系统边界成立")
          PY

  agent-lite:
    name: Agent image (lite, linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    needs: [resolve]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-agent:${{ needs.resolve.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/ace-agent:lite
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.title=ace-agent
            org.opencontainers.image.description=ACE 整体镜像（lite 档，无内置模型）
      - name: Record digest
        run: |
          echo "### ace-agent (lite)" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # GHCR 的包默认是 private，私有包拉不动等于没发。这里尽力改成 public；
  # 改不动（权限不足）只告警不失败 —— 手动路径写在 job summary 里，
  # 别让一次权限问题把已经推成功的镜像标成失败。
  visibility:
    name: Make packages public (best effort)
    runs-on: ubuntu-latest
    needs: [resolve, sandbox, agent-lite]
    continue-on-error: true
    steps:
      - name: PATCH package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ needs.resolve.outputs.owner }}
        run: |
          for PKG in ace-sandbox ace-agent; do
            echo "-> $PKG"
            gh api --method PATCH \
              "/orgs/${OWNER}/packages/container/${PKG}" \
              -f visibility=public 2>&1 || \
            gh api --method PATCH \
              "/users/${OWNER}/packages/container/${PKG}" \
              -f visibility=public 2>&1 || \
            echo "::warning::$PKG 可见性改不动（多半是 token 权限），请手动设为 Public："\
          "https://github.com/orgs/${OWNER}/packages/container/${PKG}/settings"
          done
      - name: Note manual fallback
        if: always()
        run: |
          echo "若上面报了 warning，去包设置里把 visibility 改成 Public（一次即可）。" >> "$GITHUB_STEP_SUMMARY"

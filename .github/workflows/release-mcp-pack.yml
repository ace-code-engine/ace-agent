name: release-mcp-pack

# 非侵入式 MCP 接入包：把 `packaging/build_mcp_bundle.ps1` 的产物挂到已有的 Release 上。
#
# 为什么单独一个工作流（而不是塞进 release-exe / release-executor）：
# 那两个是**已验证过**的链路（MSI/zip + 五平台执行器），往里加步骤就得重新验一遍它们的
# 顺序与竞态；而这个包的构建是**纯源码打包**，与它们没有依赖关系。`gh release upload --clobber`
# 幂等，所以"Release 已存在就补一个资产"这件事可以独立做、失败也不影响主发布。
#
# 手动派发（Release 必须已经存在；本仓库由 release-executor 建）：
#   gh workflow run release-mcp-pack.yml -f version=3.47.0
# 不给 version 就从 core/version.py 读。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本(如 3.47.0；留空自动读 core/version.py)"
        required: false
        type: string

permissions:
  contents: write        # gh release upload 需要它

concurrency:
  group: release-mcp-pack
  cancel-in-progress: false

jobs:
  pack:
    name: Build + attach ace-mcp pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c 'from core import version; print(version.__version__)')"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build the pack (same script developers run locally)
        shell: pwsh
        run: |
          ./packaging/build_mcp_bundle.ps1

      - name: Smoke the pack from a clean extraction
        # 只在**解压出来的目录**里跑才算验过：少一个模块只有在那一刻才暴露。
        # 这正是本地第一次构建被抓到的那条（ai_code 顶层 import agent_runner）。
        run: |
          set -e
          VERSION="${{ steps.version.outputs.resolved }}"
          ZIP="dist/ace-mcp-${VERSION}.zip"
          test -f "$ZIP" || { echo "pack not built: $ZIP"; exit 1; }
          mkdir -p /tmp/unpack && cd /tmp/unpack
          unzip -q "$GITHUB_WORKSPACE/$ZIP"
          python3 verify-mcp.py
          python3 - <<'EOF'
          import json, pathlib
          v = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          assert v, "VERSION stamp missing"
          cfg = json.loads(pathlib.Path("configs/cline_mcp_settings.json").read_text(encoding="utf-8"))
          assert "mcpServers" in cfg and "ace" in cfg["mcpServers"], cfg
          print("pack contents OK, VERSION =", v)
          EOF

      - name: Attach to the existing Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.resolved }}"
          TAG="v${VERSION}"
          ZIP="dist/ace-mcp-${VERSION}.zip"
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} 还不存在 —— 先跑 release-executor，再回来派发这个。"
            exit 1
          fi
          gh release upload "${TAG}" "${ZIP}" --clobber --repo "${{ github.repository }}"
          echo "已把 $(basename "$ZIP") 挂到 ${TAG}"

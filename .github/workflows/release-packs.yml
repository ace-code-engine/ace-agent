name: release-packs

# 两个"直接给用户"的包，挂到已有的 Release 上：
#   hooh-mcp-server-<ver>.zip      —— 非侵入式 MCP 服务包（挂到用户自己的 agent 上）
#   hooh-sandbox-bundle-<ver>.zip  —— 一体包（虚拟化底座 + 同一个 MCP 服务层）
#
# 为什么单独一个工作流（而不是塞进 release-exe / release-executor）：
# 那两个是**已验证过**的链路（MSI/zip + 五平台执行器），往里加步骤就得重新验一遍它们的
# 顺序与竞态；而这两个包都是**纯源码打包**，与它们没有依赖。`gh release upload --clobber`
# 幂等，所以"Release 已存在就补资产"可以独立做、失败也不影响主发布。
#
# 手动派发（Release 必须先存在；本仓库由 release-executor 建）：
#   gh workflow run release-packs.yml -f version=3.47.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本(如 3.47.0；留空自动读 core/version.py)"
        required: false
        type: string

permissions:
  contents: write        # gh release upload 需要它

concurrency:
  group: release-packs
  cancel-in-progress: false

jobs:
  packs:
    name: Build + attach the two user-facing packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c 'from core import version; print(version.__version__)')"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build both packs (same scripts developers run locally)
        shell: pwsh
        run: |
          ./packaging/build_mcp_bundle.ps1
          ./packaging/build_allinone_bundle.ps1

      - name: Verify pack contents from clean extractions
        # 只在**解压出来的目录**里跑才算验过：少一个模块只有在那一刻才暴露。
        # 本地第一次构建就是被这条抓到的（ai_code 顶层 import agent_runner）。
        # 注意：这一段里不要出现顶格的 heredoc —— 它会把 YAML 的块缩进打断（第一版就是这么废的）。
        run: |
          set -e
          V="${{ steps.version.outputs.resolved }}"
          M="${GITHUB_WORKSPACE}/dist/hooh-mcp-server-${V}.zip"
          A="${GITHUB_WORKSPACE}/dist/hooh-sandbox-bundle-${V}.zip"
          test -f "$M" || { echo "mcp pack missing: $M"; exit 1; }
          test -f "$A" || { echo "all-in-one pack missing: $A"; exit 1; }
          for z in "$M" "$A"; do
            d="/tmp/pk_$(basename "$z" .zip)"
            mkdir -p "$d"
            (cd "$d" && unzip -q "$z")
            echo "--- smoke $(basename "$z") ---"
            python3 "$d/verify-mcp.py"
            extra=""
            case "$z" in *secbox*) extra="--with-base" ;; esac
            python3 "$GITHUB_WORKSPACE/packaging/verify_pack_contents.py" "$d" $extra
          done
          test -f "/tmp/pk_hooh-sandbox-bundle-${V}/sandbox/preflight.sh" || { echo "all-in-one pack is missing the base half"; exit 1; }
          test -f "/tmp/pk_hooh-sandbox-bundle-${V}/setup-all.sh" || { echo "all-in-one pack is missing setup-all.sh"; exit 1; }
          echo "both packs verify"

      - name: Attach to the existing Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.resolved }}"
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} 还不存在 —— 先跑 release-executor，再回来派发这个。"
            exit 1
          fi
          gh release upload "${TAG}" \
            "dist/hooh-mcp-server-${VERSION}.zip" "dist/hooh-sandbox-bundle-${VERSION}.zip" \
            --clobber --repo "${{ github.repository }}"
          echo "已把两个包挂到 ${TAG}"

  # Self-contained MCP server: one executable per platform, no Python / pip / venv
  # on the target machine. This is the answer to "don't make me prepare an
  # environment" -- the source pack above still needs Python 3.10+.
  #
  # Why a matrix instead of one runner: PyInstaller does not cross-compile. Each
  # artifact must be built on the OS it runs on, or it is a binary that has never
  # been executed anywhere. The verify step below runs it before it ships.
  frozen-mcp:
    name: Frozen MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-amd64
            exe: dist/hooh-mcp/hooh-mcp.exe
          - os: ubuntu-latest
            asset: linux-amd64
            exe: dist/hooh-mcp/hooh-mcp
          - os: macos-14
            asset: macos-arm64
            exe: dist/hooh-mcp/hooh-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller requests

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python -c 'from core import version; print(version.__version__)')"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build (PyInstaller, one-dir)
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build_mcp packaging/hooh-mcp.spec

      - name: Verify the executable actually serves MCP
        # The gate that matters: boot -> tools/list -> tools/call -> stdout purity.
        # A frozen build that lost a hidden import or a data dir fails right here
        # instead of on a user's machine.
        shell: bash
        run: python packaging/verify-mcp-frozen.py "${{ matrix.exe }}"

      - name: Package
        shell: bash
        run: |
          V="${{ steps.version.outputs.resolved }}"
          OUT="dist/hooh-mcp-$V-${{ matrix.asset }}"
          mkdir -p "$OUT"
          cp -r dist/hooh-mcp/. "$OUT"/
          (cd "$OUT" && python -c "import shutil,sys; shutil.make_archive('../hooh-mcp-$V-${{ matrix.asset }}', 'zip', '.' )")
          ls -l dist/hooh-mcp-$V-${{ matrix.asset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frozen-mcp-${{ matrix.asset }}
          path: dist/hooh-mcp-*-${{ matrix.asset }}.zip
          if-no-files-found: error

  attach-frozen-mcp:
    name: Attach the frozen MCP builds to the Release
    needs: frozen-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: frozen-mcp-*
          merge-multiple: true

      - name: Attach (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(python -c 'from core import version; print(version.__version__)')"
          fi
          TAG="v${VERSION}"
          echo "attaching frozen MCP builds for ${TAG}"
          ls -l dist
          gh release upload "${TAG}" dist/hooh-mcp-*.zip --clobber --repo "${{ github.repository }}"

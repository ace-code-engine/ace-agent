<!-- HooH 标识：原创几何构图，无任何第三方素材 / 字体轮廓，可自由商用。
     构图含义：「互」—— 上横骨向左折下、下横骨向右折上，两骨交错，
     被中间一竖贯穿扣住。这就是这个项目的形状：模型提出 ⇄ 代码裁决，
     写了快照 ⇄ 才谈得上 undo，每一次动作都有对等回应、而且可逆。
     交错的两骨对应 HMAC 链式审计（链节互相咬住）。
     配色：白底 + 纯黑 #000000（实心单色，无渐变）。
     （与《崩坏：星穹铁道》的"均衡"星神 HooH 只是同名致敬，本图不含任何米哈游素材。） -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"
     role="img" aria-label="HooH · 互">
  <title>HooH · 互</title>

  <!-- 底板：白，无描边（纯色，无渐变） -->
  <rect width="128" height="128" rx="28" fill="#ffffff"/>

  <!-- 上横骨：右上往左折下，喂进中间那一竖 -->
  <path d="M100 28 H40 V54" fill="none" stroke="#000000" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 下横骨：右下往左折上，与上骨互扣 -->
  <path d="M28 100 H88 V74" fill="none" stroke="#000000" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 贯穿的一竖：把两骨扣在一起的那一下 -->
  <path d="M64 40 V88" fill="none" stroke="#000000" stroke-width="13"
        stroke-linecap="round"/>
</svg>
